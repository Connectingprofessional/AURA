<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | 3D Layout Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Three.js Core and Add-ons from Unpkg CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
</head>
<body>
    <div id="app-shell">
        <header class="app-header">
            <div class="logo">AURA <span>3D</span></div>
            <p>Interactive Workspace Environment</p>
        </header>
        <main class="stage-wrapper">
            <!-- Target container canvas layout for 3D engine scene assets -->
            <div id="canvas-3d-stage"></div>
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
